name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Build test image
        run: docker compose build test

      - name: Run linter
        run: docker compose run --rm lint

      - name: Run tests
        run: docker compose run --rm test

      - name: Run integration tests
        run: HOST_PORT=0 docker compose -f docker-compose.yml -f docker-compose.test.yml run --rm --build integration-test

      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml down

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Verify default and customized Docker images
        run: ./scripts/test-image-guide.sh

  plugin:
    name: Agent plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: false

      - name: Agent Plugins manifest
        run: uvx check-jsonschema --schemafile https://agent-plugins.org/schemas/1.0.0/plugin.schema.json plugins/trove/plugin.json

      - name: Agent Skills
        run: uvx --from skills-ref agentskills validate plugins/trove/skills/trove

      - name: Claude Code plugin and marketplace
        run: |
          npx -y @anthropic-ai/claude-code@2.1.319 plugin validate .
          npx -y @anthropic-ai/claude-code@2.1.319 plugin validate plugins/trove

      - name: One version everywhere
        run: |
          v=$(jq -r .version plugins/trove/plugin.json)
          test "$v" = "$(jq -r '.plugins[] | select(.name == "trove") | .version' .claude-plugin/marketplace.json)"
          grep -q "trove-plugin/$v" plugins/trove/skills/trove/SKILL.md

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check public-source boundary
        run: ./scripts/check-public-source.sh

      - name: Scan Git history for secrets
        run: |
          docker run --rm -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.30.1 \
            git --redact --no-banner /repo

      - name: Scan Go dependencies
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

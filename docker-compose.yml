services:
  minio:
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

  minio-setup:
    image: quay.io/minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 2;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/trove-uploads-development;
      exit 0;
      "

  app:
    build: .
    ports:
      - "${HOST_PORT:-8080}:8080"
    depends_on:
      minio-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 2s
      timeout: 3s
      retries: 10
    environment:
      - ENVIRONMENT=development
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
    develop:
      watch:
        - action: rebuild
          path: .
          ignore:
            - bin/
            - .git/

  test:
    build:
      context: .
      target: builder
    command: ["go", "test", "./...", "-v", "-count=1"]
    volumes:
      - ./:/app

  lint:
    image: golangci/golangci-lint:v2.12.2-alpine
    working_dir: /app
    volumes:
      - ./:/app
    command: ["golangci-lint", "run", "./..."]

  integration-test:
    build:
      context: .
      target: builder
    command: ["go", "test", "-tags", "integration", "-v", "-count=1", "-timeout", "5m", "./cmd/server/..."]
    depends_on:
      app:
        condition: service_healthy
    environment:
      - HOST_PORT=8080
      - BASE_URL=http://app:8080
